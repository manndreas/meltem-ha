name: Bug report
description: Report a problem with the Meltem Modbus integration.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Before opening an issue, check whether it has already been reported.
        See the [diagnostics guide](https://github.com/manndreas/meltem-ha/blob/main/docs/DIAGNOSTICS.md) if useful.

        Do not post app setup codes, passwords, tokens, or full logs. Review diagnostic files and remove private details before attaching them.

  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe what you expected and what happened instead.
      placeholder: A temperature entity stays unavailable after setup.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: List the steps, or say when/how often the problem occurs.
      placeholder: |
        1. Open ...
        2. ...
    validations:
      required: true

  - type: textarea
    id: unit
    attributes:
      label: Affected unit(s), if relevant
      description: Include the model from the type plate and the profile selected in the integration. Do not include the app setup code.
      placeholder: |
        Model: M-WRG-S/Z-T-F
        Selected profile: M-WRG-S (-F)
        Affected units: 1 of 8
    validations:
      required: false

  - type: textarea
    id: environment
    attributes:
      label: Versions and connection
      description: Add what you know; it is fine to leave unknown details out.
      placeholder: |
        Home Assistant: 2026.11.0
        Meltem Modbus: 5.1.0
        Gateway connection: USB, RTU-over-TCP bridge, or Modbus TCP (for example, ESP32)
    validations:
      required: false

  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics or relevant log excerpt (optional)
      description: Attach the integration diagnostics after creating the issue, if useful. Review it first; include only relevant log lines and redact private details.
      placeholder: Include the affected entity state or the unit's last read error, if available.
    validations:
      required: false

  - type: textarea
    id: additional_context
    attributes:
      label: Anything else? (optional)
      description: Add a screenshot or other detail that may help reproduce the problem. Remove private information first.
    validations:
      required: false
