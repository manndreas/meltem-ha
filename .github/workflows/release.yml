name: Release

on:
  push:
    tags:
      - "v*"
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Version tag to create or release, for example v4.1.0"
        required: true
        type: string

permissions:
  contents: read
  actions: read

# A tag push and a published release can both fire for one tag.
concurrency:
  group: release-${{ github.event.inputs.tag_name || github.event.release.tag_name || github.ref_name }}
  cancel-in-progress: false

env:
  # pytest-homeassistant-custom-component dictates the minimum Python version.
  PYTHON_VERSION: "3.14"

jobs:
  verify_ci:
    name: Verify CI for release commit
    runs-on: ubuntu-26.04
    outputs:
      release_sha: ${{ steps.release_commit.outputs.sha }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.ref }}

      - name: Resolve release commit
        id: release_commit
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"

      - name: Require successful CI run for this commit
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ steps.release_commit.outputs.sha }}
        shell: bash
        run: |
          MAX_WAIT_SECONDS=1800
          POLL_INTERVAL_SECONDS=30
          WAITED_SECONDS=0

          while true; do
            CI_STATE=$(gh api \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${RELEASE_SHA}&branch=main&event=push&per_page=100" \
              --jq '
                if any(.workflow_runs[]; .conclusion == "success") then "success"
                elif any(.workflow_runs[]; .status != "completed") then "pending"
                elif (.workflow_runs | length) == 0 then "missing"
                else "failed"
                end')

            case "${CI_STATE}" in
              success)
                echo "Found a successful CI run for ${RELEASE_SHA} on main."
                break
                ;;
              pending)
                if [ "${WAITED_SECONDS}" -ge "${MAX_WAIT_SECONDS}" ]; then
                  echo "::error::CI for ${RELEASE_SHA} on main is still running after 30 minutes."
                  exit 1
                fi
                echo "CI for ${RELEASE_SHA} is queued or running; waiting ${POLL_INTERVAL_SECONDS}s."
                sleep "${POLL_INTERVAL_SECONDS}"
                WAITED_SECONDS=$((WAITED_SECONDS + POLL_INTERVAL_SECONDS))
                ;;
              missing)
                echo "::error::No CI run for ${RELEASE_SHA} on main was found."
                exit 1
                ;;
              failed)
                echo "::error::CI for ${RELEASE_SHA} on main completed without a successful run."
                exit 1
                ;;
              *)
                echo "::error::Unexpected CI state '${CI_STATE}' for ${RELEASE_SHA}."
                exit 1
                ;;
            esac
          done

  build:
    name: Build Release Artifact
    runs-on: ubuntu-26.04
    needs: verify_ci
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify_ci.outputs.release_sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Determine release tag
        id: release_meta
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ github.event.inputs.tag_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            TAG_NAME="${INPUT_TAG}"
          elif [ "${EVENT_NAME}" = "release" ]; then
            TAG_NAME="${RELEASE_TAG}"
          else
            TAG_NAME="${REF_NAME}"
          fi

          ZIP_NAME="meltem-ha-${TAG_NAME}.zip"

          echo "tag_name=${TAG_NAME}" >> "${GITHUB_OUTPUT}"
          echo "zip_name=${ZIP_NAME}" >> "${GITHUB_OUTPUT}"

      - name: Check release version
        shell: bash
        env:
          TAG_NAME: ${{ steps.release_meta.outputs.tag_name }}
        run: |
          MANIFEST_VERSION=$(python -c "import json; print(json.load(open('custom_components/meltem_ventilation/manifest.json'))['version'])")
          PYPROJECT_VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if [ "${TAG_NAME#v}" != "${MANIFEST_VERSION}" ] || [ "${MANIFEST_VERSION}" != "${PYPROJECT_VERSION}" ]; then
            echo "::error::Tag ${TAG_NAME}, manifest.json ${MANIFEST_VERSION} and pyproject.toml ${PYPROJECT_VERSION} disagree"
            exit 1
          fi

      - name: Ensure release tag does not point to another commit
        env:
          RELEASE_SHA: ${{ needs.verify_ci.outputs.release_sha }}
          TAG_NAME: ${{ steps.release_meta.outputs.tag_name }}
        shell: bash
        run: |
          TAG_REF="refs/tags/${TAG_NAME}"
          REMOTE_TAG=$(git ls-remote --refs origin "${TAG_REF}")

          if [ -z "${REMOTE_TAG}" ]; then
            echo "Tag ${TAG_NAME} does not exist and will be created for ${RELEASE_SHA}."
            exit 0
          fi

          git fetch --no-tags origin "${TAG_REF}:${TAG_REF}"
          EXISTING_TAG_SHA=$(git rev-parse "${TAG_REF}^{commit}")
          if [ "${EXISTING_TAG_SHA}" != "${RELEASE_SHA}" ]; then
            echo "::error::Tag ${TAG_NAME} already points to ${EXISTING_TAG_SHA}, not the verified release commit ${RELEASE_SHA}."
            exit 1
          fi

      - name: Build release archive
        shell: bash
        run: |
          mkdir -p dist
          zip -r "dist/${{ steps.release_meta.outputs.zip_name }}" \
            custom_components \
            CHANGELOG.md \
            LICENSE \
            README.md \
            hacs.json \
            -x '*/__pycache__/*'

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ needs.verify_ci.outputs.release_sha }}
          TAG_NAME: ${{ steps.release_meta.outputs.tag_name }}
          ZIP_NAME: ${{ steps.release_meta.outputs.zip_name }}
        shell: bash
        run: |
          if gh release view "${TAG_NAME}" >/dev/null 2>&1; then
            gh release upload "${TAG_NAME}" "dist/${ZIP_NAME}" --clobber
          else
            gh release create "${TAG_NAME}" "dist/${ZIP_NAME}" \
              --target "${RELEASE_SHA}" \
              --generate-notes
          fi
