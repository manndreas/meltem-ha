name: Release

on:
  push:
    tags:
      - "v*"
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Existing tag to release, for example v0.1.0"
        required: true
        type: string

permissions:
  contents: read

env:
  # pytest-homeassistant-custom-component dictates the minimum Python version.
  PYTHON_VERSION: "3.14"

jobs:
  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Run hassfest
        uses: home-assistant/actions/hassfest@06749dd8c0b54f350bc69c8752456cee498808a3 # master

  ruff:
    name: Ruff
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install ruff
        run: python -m pip install --upgrade pip ruff==0.15.20

      - name: Run ruff
        run: ruff check custom_components tests

  pytest:
    name: Pytest
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-test.txt

      - name: Run test suite
        run: pytest

  hacs:
    name: HACS Validation
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Run HACS validation
        uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa # main
        with:
          category: integration
          ignore: topics

  build:
    name: Build Release Artifact
    runs-on: ubuntu-latest
    needs:
      - hassfest
      - ruff
      - pytest
      - hacs
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Validate Python sources
        run: python -m py_compile custom_components/meltem_ventilation/*.py

      - name: Determine release tag
        id: release_meta
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ github.event.inputs.tag_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            TAG_NAME="${INPUT_TAG}"
          elif [ "${EVENT_NAME}" = "release" ]; then
            TAG_NAME="${RELEASE_TAG}"
          else
            TAG_NAME="${REF_NAME}"
          fi

          ZIP_NAME="meltem-ha-${TAG_NAME}.zip"

          echo "tag_name=${TAG_NAME}" >> "${GITHUB_OUTPUT}"
          echo "zip_name=${ZIP_NAME}" >> "${GITHUB_OUTPUT}"

      - name: Check release version
        shell: bash
        env:
          TAG_NAME: ${{ steps.release_meta.outputs.tag_name }}
        run: |
          MANIFEST_VERSION=$(python -c "import json; print(json.load(open('custom_components/meltem_ventilation/manifest.json'))['version'])")
          PYPROJECT_VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if [ "${TAG_NAME#v}" != "${MANIFEST_VERSION}" ] || [ "${MANIFEST_VERSION}" != "${PYPROJECT_VERSION}" ]; then
            echo "::error::Tag ${TAG_NAME}, manifest.json ${MANIFEST_VERSION} and pyproject.toml ${PYPROJECT_VERSION} disagree"
            exit 1
          fi

      - name: Build release archive
        shell: bash
        run: |
          mkdir -p dist
          zip -r "dist/${{ steps.release_meta.outputs.zip_name }}" \
            custom_components \
            CHANGELOG.md \
            LICENSE \
            README.md \
            hacs.json

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ steps.release_meta.outputs.tag_name }}
          ZIP_NAME: ${{ steps.release_meta.outputs.zip_name }}
        shell: bash
        run: |
          if gh release view "${TAG_NAME}" >/dev/null 2>&1; then
            gh release upload "${TAG_NAME}" "dist/${ZIP_NAME}" --clobber
          else
            gh release create "${TAG_NAME}" "dist/${ZIP_NAME}" --generate-notes
          fi
