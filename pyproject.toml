[project]
name = "meltem-modbus"
version = "3.0.2"
requires-python = ">=3.13"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
# Deliberately close to the ruff default: catch real defects (undefined names,
# unused imports, syntax errors) without forcing a repo-wide reformat.
# "I" keeps the long const.py import blocks sorted.
select = ["E4", "E7", "E9", "F", "I"]
