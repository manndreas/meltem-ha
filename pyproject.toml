[project]
name = "meltem-modbus"
version = "5.1.0"
requires-python = ">=3.14"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:respx"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
# Deliberately close to the ruff default: catch real defects (undefined names,
# unused imports, syntax errors); `ruff format --check` covers the layout.
# "I" keeps the long const.py import blocks sorted.
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.14"
files = ["custom_components/meltem_ventilation"]
strict = true

[tool.coverage.run]
source = ["custom_components/meltem_ventilation"]
branch = true

[tool.coverage.report]
fail_under = 98
show_missing = true
skip_covered = true
